<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f6">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} — feed" href="{{ '/feed.xml' | absolute_url }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Kevin Heavey, home">Kevin Heavey<span class="wordmark-mark" aria-hidden="true">.</span></a>
        <nav aria-label="Main navigation">
          <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Writing</a>
          <a href="https://github.com/kevinheavey" rel="me">GitHub</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        </nav>
      </header>
      <main id="content">{{ content }}</main>
      <footer class="site-footer">
        <span>© {{ 'now' | date: '%Y' }} Kevin Heavey</span>
        <a href="{{ '/feed.xml' | relative_url }}">Subscribe via RSS</a>
      </footer>
    </div>
  </body>
</html>
